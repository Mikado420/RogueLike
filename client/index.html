<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#0b0b14">
<title>進化の迷宮</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DotGothic16&family=Press+Start+2P&display=swap" media="print" onload="this.media='all'">
<link rel="stylesheet" href="./style.css">
</head>
<body>
<div id="app">
  <canvas id="screen" width="320" height="180" aria-label="ゲーム画面"></canvas>
  <canvas id="minimap" width="46" height="34" hidden aria-label="ミニマップ"></canvas>
  <div id="hud" hidden></div>
  <div id="touch" hidden>
    <div id="stick-zone"></div>
    <div id="stick"><div id="stick-knob"></div></div>
    <div id="buttons">
      <button data-btn="atk" class="tb atk" aria-label="攻撃"><span>攻撃</span></button>
      <button data-btn="s1" class="tb s1" aria-label="技1"><i class="cd"></i><span class="lbl">技1</span></button>
      <button data-btn="s2" class="tb s2" aria-label="技2"><i class="cd"></i><span class="lbl">技2</span></button>
      <button data-btn="dodge" class="tb dodge" aria-label="回避"><i class="cd"></i><span>回避</span></button>
      <button data-btn="potion" class="tb potion" aria-label="回復薬"><span>薬</span><b class="cnt">0</b></button>
      <button data-btn="act" class="tb act" aria-label="調べる" hidden><span class="lbl">調べる</span></button>
    </div>
  </div>
  <div id="toasts" aria-live="polite"></div>
  <div id="panel" hidden></div>
</div>
<script type="module" src="./main.js"></script>
</body>
</html>
