<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#0b0b14">
<title>進化の迷宮</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DotGothic16&family=Press+Start+2P&display=swap" media="print" onload="this.media='all'">
<link rel="stylesheet" href="./style.css">
</head>
<body>
<div id="app">
  <canvas id="screen" width="320" height="180" aria-label="ゲーム画面"></canvas>
  <div id="hud" hidden></div>
  <div id="touch" hidden>
    <div id="stick"><div id="stick-knob"></div></div>
    <div id="buttons">
      <button data-btn="atk" class="tb big">攻撃</button>
      <button data-btn="s1" class="tb">技1</button>
      <button data-btn="s2" class="tb">技2</button>
      <button data-btn="dodge" class="tb">回避</button>
      <button data-btn="act" class="tb">調べる</button>
      <button data-btn="potion" class="tb">薬</button>
    </div>
  </div>
  <div id="toasts" aria-live="polite"></div>
  <div id="panel" hidden></div>
</div>
<script type="module" src="./main.js"></script>
</body>
</html>
